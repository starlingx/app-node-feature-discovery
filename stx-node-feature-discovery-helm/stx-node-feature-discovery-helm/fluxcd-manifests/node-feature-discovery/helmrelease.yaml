apiVersion: "helm.toolkit.fluxcd.io/v2beta1"
kind: HelmRelease
metadata:
  name: node-feature-discovery
  labels:
    chart_group: node-feature-discovery-charts
spec:
  releaseName: node-feature-discovery
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.13.1
      sourceRef:
        kind: HelmRepository
        name: stx-platform
  interval: 1m
  timeout: 30m
  test:
    enable: false
  install:
    disableHooks: false
  upgrade:
    disableHooks: false
  valuesFrom:
    - kind: Secret
      name: node-feature-discovery-static-overrides
      valuesKey: node-feature-discovery-static-overrides.yaml
    - kind: Secret
      name: node-feature-discovery-system-overrides
      valuesKey: node-feature-discovery-system-overrides.yaml
