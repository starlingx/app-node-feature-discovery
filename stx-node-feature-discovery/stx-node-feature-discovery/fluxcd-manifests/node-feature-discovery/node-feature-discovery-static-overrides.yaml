imagePullSecrets: [{"name": "default-registry-key"}]
image:
  # cleans the default digest value since sysinv changes the digest when pushing the image to the local registry
  digest: ""
  repository: registry.k8s.io/nfd/node-feature-discovery
  tag: v0.17.3

namespaceOverride: "node-feature-discovery"

master:
  resources:
    requests:
      cpu: 0
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5

worker:
  tolerations:
  - key: "node-role.kubernetes.io/master"
    operator: Exists
    effect: NoSchedule
  - key: "node-role.kubernetes.io/control-plane"
    operator: Exists
    effect: NoSchedule
  config:
    core:
      sleepInterval: 3600s
  resources:
    requests:
      cpu: 0
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5

topologyUpdater:
  resources:
    requests:
      cpu: 0

gc:
  resources:
    requests:
      cpu: 0
